<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DTC Workshop — 3.3L Diagnostic Assistant</title>
<meta name="description" content="Offline service-workshop dashboard over the 3.3L DTC manual. Synthetic demo data.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to main content</a>

<!-- Inline icon sprite: no icon font, no CDN, nothing fetched. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-fleet" viewBox="0 0 24 24"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="17" r="2"/><circle cx="17.5" cy="17" r="2"/></symbol>
    <symbol id="i-vehicle" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 1 0 3 6.9l4.6 4.6-2.1 2.1-4.6-4.6a4 4 0 0 1-6.9-3L3 5.5 5.5 3l5.8 5.8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    <symbol id="i-audit" viewBox="0 0 24 24"><path d="M4 4h16v3H4zM4 9h16v3H4zM4 14h10v3H4zM4 19h7v2H4z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4 4l2 2M18 18l2 2M20 4l-2 2M6 18l-2 2" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M14 2a10 10 0 1 0 8 15.7A11 11 0 0 1 14 2z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" fill="none"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 3h10v4H7zM4 8h16v8h-3v-4H7v4H4z"/><path d="M7 15h10v6H7z"/></symbol>
    <symbol id="i-why" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.4 9a2.7 2.7 0 1 1 3.6 2.5v1.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12.3" cy="16.8" r="1.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M8 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
  </defs>
</svg>

<div class="shell">
  <!-- ------------------------------------------------------------ sidebar -->
  <aside class="sidebar" aria-label="Sections">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">3.3</span>
      <span class="brand-text"><strong>DTC Workshop</strong><small>3.3L diagnostic assistant</small></span>
    </div>
    <nav class="nav" aria-label="Main">
      <button class="nav-item" data-view="fleet" aria-current="page">
        <svg aria-hidden="true"><use href="#i-fleet"></use></svg><span>Fleet</span></button>
      <button class="nav-item" data-view="vehicle">
        <svg aria-hidden="true"><use href="#i-vehicle"></use></svg><span>Vehicle</span></button>
      <button class="nav-item" data-view="symptom">
        <svg aria-hidden="true"><use href="#i-search"></use></svg><span>Service query</span></button>
      <button class="nav-item" data-view="audit">
        <svg aria-hidden="true"><use href="#i-audit"></use></svg><span>Audit</span></button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn ghost block" id="presets-btn" aria-expanded="false" aria-controls="presets">
        Demo presets</button>
      <p class="synthetic">Synthetic — illustrative data only. No proprietary TATA data is used.</p>
      <p class="small muted" id="build"></p>
    </div>
  </aside>

  <!-- ------------------------------------------------------------- topbar -->
  <header class="topbar">
    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="q">Search a vehicle, registration, P-code or symptom</label>
      <svg class="search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="q" name="q" type="search" autocomplete="off"
             placeholder="Vehicle, registration, P-code (P0192-00) or a symptom…">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div class="topbar-right">
      <a class="uilink" href="/" title="Open the classic interface">Classic UI</a>
      <button class="btn icon" id="theme" aria-pressed="false" title="Toggle dark mode">
        <svg class="only-light" aria-hidden="true"><use href="#i-moon"></use></svg>
        <svg class="only-dark" aria-hidden="true"><use href="#i-sun"></use></svg>
        <span class="sr-only">Toggle dark mode</span>
      </button>
    </div>
  </header>

  <!-- --------------------------------------------------------------- main -->
  <main id="view" class="view" tabindex="-1"></main>
</div>

<!-- presets drawer -->
<div class="drawer" id="presets" data-open="0" role="dialog" aria-modal="false" aria-label="Demo presets">
  <div class="drawer-head"><h2>Demo presets</h2>
    <button class="btn icon" data-close="presets"><svg aria-hidden="true"><use href="#i-close"></use></svg>
      <span class="sr-only">Close</span></button></div>
  <div class="drawer-body" id="presets-body"></div>
</div>

<!-- why panel -->
<div class="drawer wide" id="why" data-open="0" role="dialog" aria-modal="false"
     aria-label="Why this answer?">
  <div class="drawer-head"><h2>Why this answer?</h2>
    <button class="btn icon" data-close="why"><svg aria-hidden="true"><use href="#i-close"></use></svg>
      <span class="sr-only">Close</span></button></div>
  <div class="drawer-body" id="why-body"></div>
</div>
<div class="scrim" id="scrim" hidden></div>

<div class="sr-only" id="live" role="status" aria-live="polite"></div>
<div id="jobcard" class="jobcard" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
